name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # build first: the examples typecheck against packages/sdk/dist
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

      # The published artifact is the product — check it, not just the config.
      - name: Verify package contents
        working-directory: packages/sdk
        run: |
          set -e
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/index.js" /tmp/pack.txt
          grep -q "dist/react/index.js" /tmp/pack.txt
          ! grep -qE "\bsrc/|tests/" /tmp/pack.txt
          # 'use client' belongs to the React entry only; on the core entry it
          # would break Node consumers.
          head -1 dist/react/index.js | grep -q "use client"
          ! head -1 dist/index.js | grep -q "use client"
          # React must never be a hard dependency of the core client.
          node -e "const p=require('./package.json');if(p.dependencies?.react)throw new Error('react must stay a peer dependency')"
